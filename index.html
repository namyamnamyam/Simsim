<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DYNASTY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="name">평민 · 16세</div>
    <div>❤️ <span id="hp">100</span>/100</div>
    <div>🪙 <span id="gold">10</span></div>
  </div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="interact">상호작용</button>

  <div id="message"></div>

  <script src="game.js"></script>
</body>
</html>
